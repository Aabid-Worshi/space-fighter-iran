<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter - Aabid Hussain Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Neon Designer Badge -->
    <div id="designer-header">
        <span>Designed by</span> Aabid Hussain
    </div>

    <!-- Main Game Window Frame -->
    <div id="game-container">
        <!-- Live HUD Status Counters -->
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">5</span>/5</div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Dynamic Menu Overlays -->
        <div id="start-screen">
            <h2>Space Fighter</h2>
            <p>Aabid Hussain Edition</p>
            <button id="startBtn">START GAME</button>
        </div>

        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <div id="final-stats">You let too many enemies pass!</div>
            <div class="game-over-credit">Designed by Aabid Hussain</div>
            <button id="restartBtn">Restart</button>
        </div>
        
        <!-- Touch Controls Layout -->
        <div id="mobile-controls">
            <button id="leftBtn" type="button">◀</button>
            <button id="rightBtn" type="button">▶</button>
        </div>
    </div>

    <!-- Elegant Region Footer Label -->
    <div id="chinar-footer">
        🍁 Chinar Kashmir 🍁
    </div>
    
    <!-- Using version cache busting token to guarantee updates refresh on all mobiles -->
    <script src="game.js?v=999"></script>
</body>
</html>
