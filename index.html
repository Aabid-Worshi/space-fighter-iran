<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - Aabid Hussain Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- गेम हेडर जहां लाइव्स और स्कोर दिखेगा -->
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">5</span>/5</div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="credit-watermark">Designed by Aabid Hussain</div>

        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <div id="final-stats">You let too many enemies pass!</div>
            <div class="game-over-credit">Designed by Aabid Hussain</div>
            <button id="restartBtn">Restart</button>
        </div>
        
        <div id="mobile-controls">
            <button id="leftBtn">◀</button>
            <button id="shootBtn">🚀 FIRE</button>
            <button id="rightBtn">▶</button>
        </div>
    </div>
    
    <script src="game.js?v=2"></script>
</body>
</html>
